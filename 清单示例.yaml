# assemble 清单示例：把多段素材拼成一条成片
#
#   python -m djkit assemble 清单示例.yaml
#   python -m djkit assemble 清单示例.yaml --dry-run
#
# 这是「影视解说号」和「盘点/合集号」的底座：一段原片 + 一段原片 + … 按顺序拼成一条。
# 时间码支持 90 / 1:30 / 00:01:30.5 三种写法。

输出: out/盘点_十部反转到最后.mp4

# ---- 全局设置（可被命令行覆盖）----
规格: 1080x1920
缩放: blur          # 横屏 16:9 转竖屏用 blur，画面完整；crop 会裁掉两侧
帧率: 25
CRF: 20

# ---- 全局花字：片名/主题，默认贴顶部 ----
花字:
  文字: "十部反转到最后"
  样式: bar
  时长: 2.5

# ---- 背景音乐（自动循环 + 淡出）----
# BGM: ../assets/bgm.mp3
# BGM音量: 0.25
# 闪避: false

# ---- 片段清单 ----
片段:
  - 源: ../素材/某电影.mp4
    起: "0:12:34"
    长: 8
    花字: "第一部 反转在这"      # 段内标签，自动让到底部，不会压住主体
    # 花字位置: bottom          # center / top / bottom
    # 字幕: ../字幕/某电影.srt   # 整份字幕自动平移到本段

  - 源: ../素材/某剧_第03集.mp4
    起: "02:10"
    长: 10
    花字: "第二部 直接封神"

  - 源: ../素材/另一部电影.mp4
    起: "1:05:00"
    长: 6
    # 不写「长」= 从起点到结尾
