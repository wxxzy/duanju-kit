# djkit 配方：把一长串参数固化成文件，一条命令跑完
#
#   python -m djkit run 配方示例.yaml              跑一次
#   python -m djkit run 配方示例.yaml --dry-run     只看计划
#   python -m djkit run 配方示例.yaml --watch 120   守着 inbound 目录，来新素材自动处理
#
# 路径都相对本文件所在目录。中英文键名都能用（素材/src、输出/out …）。

名称: 示例项目

# ---- 输入输出（必填）----
素材: 示例/原始素材
输出: _run_out/成片

# ---- 切片（不写这段就跳过切片，直接用素材做正片）----
切片:
  模式: head        # head 开头N秒 / even 每N秒一段 / ranges 指定区间
  时长: 8           # head 模式的秒数
  # 段长: 30        # even 模式
  # 区间: "0-15,60-75"   # ranges 模式

# ---- 字幕 ----
字幕: 示例/原始素材     # 目录或列表；不写则不烧
字幕样式: default
# 字幕字号: 64

# ---- 花字 / 标题条 ----
花字:
  模板: "{剧名} {集}"    # 也可用 文字: 固定一句；或 表: 标题表.csv 逐条指定
  样式: bar
  字号: 80
  位置: top
  开始: 0.3
  时长: 3

# ---- 音频与节奏 ----
变速: 1.1
# BGM: 素材库/bgm.mp3
# BGM音量: 0.25
# 闪避: true
# BGM淡出: 2

# ---- 片头片尾 ----
# 片头: 素材库/片头.mp4
# 片尾: 素材库/片尾.mp4

# ---- 输出 ----
规格: [1080x1920, 1080x1440]
缩放: blur
帧率: 25
CRF: 20
封面: auto
封面尺寸: [720x1280]
台账: _run_out/投放台账.xlsx

# ---- 收尾 ----
清理: false        # true = 出片后删掉中间切片目录
