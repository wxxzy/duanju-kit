# 解说模式配方：一条命令从长片/剧集直接产出解说成片
#
#   python -m djkit run 配方示例_解说.yaml             跑一次
#   python -m djkit run 配方示例_解说.yaml --dry-run    只看计划
#
# 流水线：高光检测 → 只转写选中片段 → LLM 写文案 → TTS 配音 → 拼接出片
# 画面会按配音长度自动裁剪，不会出现后面半分钟没声音。

名称: 某剧解说
模式: 解说          # 写「解说」走这条流水线；不写或写「切片」走原来的切片流水线

素材: ../素材/某剧                # 可以是单个文件，也可以是整季目录
输出: out/解说

解说:
  # ---- 选片段 ----
  段数: 6            # 每个素材挑几段
  段长: 8            # 每段几秒

  # ---- 转写 ----
  转写: true         # 关掉就跳过 ASR（比如你已经有台词本，用「片段」手写文案）
  语言: en
  字幕模型: small.en  # 英文对白用 .en 后缀性价比最高；中文片源用 small/medium

  # ---- 对位方式 ----
  按段: true         # true：每段单独写 1~2 句、单独配音，画面长度跟着配音走（推荐）
#                    # false：一条连续旁白铺在蒙太奇上，中段容易和画面错位

  # ---- 文案 ----
  解说时长: 26       # 目标配音时长（秒）。不写就用片段总长
  文案版本: 1        # 生成几版，选 A 版出片（多版会写到 _工作/文案/）
  风格: 克制的叙述，不煽情，偶尔一句冷判断
  背景: "剧名《某某》第一季第一集。外星人入侵六个月后……（人物关系、前情，写越细文案越好）"
  # ---- 剧集总纲（整季做的时候开，能保证十集称呼统一、剧情连贯）----
  # 先跑：python -m djkit series "素材目录" --model small.en --lang en
  总纲: 自动        # 自动：找 素材目录 / 上一级 / 输出目录 下的 总纲.md
#                   # 关：不注入；或直接写 总纲.md 的路径

  # ---- 配音 ----
  音色: zh-CN-YunjianNeural   # 低沉男声；通用解说用 zh-CN-YunxiNeural
  语速: "+0%"
  原声音量: 0.12             # 原声让路，否则听不清旁白

# ---- 全局 ----
规格: [1080x1920]
缩放: blur          # 横屏转竖屏必须 blur，crop 会裁掉原片硬字幕
花字:
  模板: "{剧名} {集}"    # 支持 {剧名} {集} {集数} {文件}
  样式: bar
封面: auto

# 已有现成片段时，直接指定，跳过自动检测（只对单个素材生效）：
# 片段:
#   - {源: ../素材/某剧E01.mp4, 起: "12:34", 长: 8}
#   - {源: ../素材/某剧E01.mp4, 起: "36:44", 长: 10}
